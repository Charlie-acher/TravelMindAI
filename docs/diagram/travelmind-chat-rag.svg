<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1520" role="img" aria-label="聊天流程 · M2需求 + M3知识回答">
<defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#24344b}.sub{fill:#5c6f86}.small{font-size:19px}.body{font-size:21px}.name{font-size:25px;font-weight:700}</style>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#899db5"/></marker></defs>
<rect width="1080" height="1520" fill="#f7f9fc" rx="18"/>
<!-- 图形按层绘制；主线向下，分支只在相邻节点之间连接。 -->
<text x="44" y="58" font-size="32" fill="#172b45" style="fill:#172b45" font-weight="700" text-anchor="start">聊天流程 · M2需求 + M3知识回答</text>
<text x="44" y="94" font-size="20" fill="#5c6f86" style="fill:#5c6f86" font-weight="400" text-anchor="start">主聊天每轮检索；个人旅行条件由需求规则处理，旅行事实由证据约束</text>
<g data-box="50,135,620,112"><rect x="50" y="135" width="620" height="112" rx="10" fill="#ffffff" stroke="#a9cdd7" stroke-width="1.7"/>
<text x="70" y="171" font-size="24" fill="#197a94" style="fill:#197a94" font-weight="700" text-anchor="start">01 接收消息、读取历史</text>
<text x="70" y="205" font-size="21" fill="#3e5168" style="fill:#3e5168" font-weight="400" text-anchor="start">会话编号 + 消息编号 + 页面已知版本</text>
</g>
<path d="M360,247 L360,290" fill="none" stroke="#899db5" stroke-width="2" marker-end="url(#arrow)"/>
<g data-box="50,295,620,112"><rect x="50" y="295" width="620" height="112" rx="10" fill="#ffffff" stroke="#b8cee7" stroke-width="1.7"/>
<text x="70" y="331" font-size="24" fill="#346cb2" style="fill:#346cb2" font-weight="700" text-anchor="start">02 提取并合并旅行需求</text>
<text x="70" y="365" font-size="21" fill="#3e5168" style="fill:#3e5168" font-weight="400" text-anchor="start">DeepSeek提取 → 本地校验 → 补问或确认</text>
</g>
<path d="M360,407 L360,450" fill="none" stroke="#899db5" stroke-width="2" marker-end="url(#arrow)"/>
<g data-box="50,455,620,144"><rect x="50" y="455" width="620" height="144" rx="10" fill="#ffffff" stroke="#cec0e1" stroke-width="1.7"/>
<text x="70" y="491" font-size="24" fill="#7956a8" style="fill:#7956a8" font-weight="700" text-anchor="start">03 强制检索知识库</text>
<text x="70" y="525" font-size="21" fill="#3e5168" style="fill:#3e5168" font-weight="400" text-anchor="start">Embedding → Milvus → PostgreSQL原文回查</text>
<text x="70" y="556" font-size="21" fill="#3e5168" style="fill:#3e5168" font-weight="400" text-anchor="start">新问题不带旧地点；过滤并保留5段证据</text>
</g>
<path d="M360,599 L360,650" fill="none" stroke="#899db5" stroke-width="2" marker-end="url(#arrow)"/>
<g data-box="50,655,620,112"><rect x="50" y="655" width="620" height="112" rx="10" fill="#ffffff" stroke="#cec0e1" stroke-width="1.7"/>
<text x="70" y="691" font-size="24" fill="#7956a8" style="fill:#7956a8" font-weight="700" text-anchor="start">04 补充网页，生成景点草稿</text>
<text x="70" y="725" font-size="21" fill="#3e5168" style="fill:#3e5168" font-weight="400" text-anchor="start">原问题搜网页 → DeepSeek综合本轮证据</text>
</g>
<path d="M360,767 L360,895" fill="none" stroke="#899db5" stroke-width="2" marker-end="url(#arrow)"/>
<g data-box="50,900,620,144"><rect x="50" y="900" width="620" height="144" rx="10" fill="#ffffff" stroke="#b1d6c8" stroke-width="1.7"/>
<text x="70" y="936" font-size="24" fill="#238366" style="fill:#238366" font-weight="700" text-anchor="start">05 整理回复与需求状态</text>
<text x="70" y="970" font-size="21" fill="#3e5168" style="fill:#3e5168" font-weight="400" text-anchor="start">自然回答 + 景点卡片 + 必要的需求补问</text>
<text x="70" y="1001" font-size="21" fill="#3e5168" style="fill:#3e5168" font-weight="400" text-anchor="start">证据不足说明无法确认；不退回自由回答</text>
</g>
<path d="M360,1044 L360,1085" fill="none" stroke="#899db5" stroke-width="2" marker-end="url(#arrow)"/>
<g data-box="50,1090,620,112"><rect x="50" y="1090" width="620" height="112" rx="10" fill="#ffffff" stroke="#b1d6c8" stroke-width="1.7"/>
<text x="70" y="1126" font-size="24" fill="#238366" style="fill:#238366" font-weight="700" text-anchor="start">06 保存完整一轮</text>
<text x="70" y="1160" font-size="21" fill="#3e5168" style="fill:#3e5168" font-weight="400" text-anchor="start">短事务复查版本，保存回答、证据与景点</text>
</g>
<path d="M360,1202 L360,1265" fill="none" stroke="#899db5" stroke-width="2" marker-end="url(#arrow)"/>
<g data-box="50,1270,620,144"><rect x="50" y="1270" width="620" height="144" rx="10" fill="#ffffff" stroke="#a9cdd7" stroke-width="1.7"/>
<text x="70" y="1306" font-size="24" fill="#197a94" style="fill:#197a94" font-weight="700" text-anchor="start">07 页面展示与刷新恢复</text>
<text x="70" y="1340" font-size="21" fill="#3e5168" style="fill:#3e5168" font-weight="400" text-anchor="start">有景点展示卡片与追问；否则展示文字</text>
<text x="70" y="1371" font-size="21" fill="#3e5168" style="fill:#3e5168" font-weight="400" text-anchor="start">刷新读取已保存快照，不重复调用模型</text>
</g>
<g data-box="730,135,300,112"><rect x="730" y="135" width="300" height="112" rx="10" fill="#ffffff" stroke="#b8cee7" stroke-width="1.7"/>
<text x="750" y="171" font-size="24" fill="#346cb2" style="fill:#346cb2" font-weight="700" text-anchor="start">已保存的同一消息</text>
<text x="750" y="205" font-size="19" fill="#3e5168" style="fill:#3e5168" font-weight="400" text-anchor="start">直接返回原结果</text>
<text x="750" y="236" font-size="19" fill="#3e5168" style="fill:#3e5168" font-weight="400" text-anchor="start">不再检索或生成</text>
</g>
<path d="M670,190 L725,190" fill="none" stroke="#899db5" stroke-width="2" marker-end="url(#arrow)"/>
<text x="680" y="173" font-size="18" fill="#5c6f86" style="fill:#5c6f86" font-weight="400" text-anchor="start">重试</text>
<g data-box="730,420,300,183"><rect x="730" y="420" width="300" height="183" rx="10" fill="#ffffff" stroke="#e1bbc5" stroke-width="1.7"/>
<text x="750" y="456" font-size="24" fill="#b55a70" style="fill:#b55a70" font-weight="700" text-anchor="start">偏好与事实要分清</text>
<text x="750" y="490" font-size="18" fill="#3e5168" style="fill:#3e5168" font-weight="400" text-anchor="start">模糊偏好：先问关键条件</text>
<text x="750" y="521" font-size="18" fill="#3e5168" style="fill:#3e5168" font-weight="400" text-anchor="start">追问可保存，短回复可接续</text>
<text x="750" y="552" font-size="18" fill="#3e5168" style="fill:#3e5168" font-weight="400" text-anchor="start">检索 / 模型故障：报错</text>
<text x="750" y="583" font-size="18" fill="#3e5168" style="fill:#3e5168" font-weight="400" text-anchor="start">事实无依据：不编造结论</text>
</g>
<path d="M670,510 L724,510" fill="none" stroke="#899db5" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<g data-box="730,645,300,202"><rect x="730" y="645" width="300" height="202" rx="10" fill="#ffffff" stroke="#dfcbaa" stroke-width="1.7"/>
<text x="750" y="681" font-size="24" fill="#a47225" style="fill:#a47225" font-weight="700" text-anchor="start">每个景点核对位置</text>
<text x="750" y="715" font-size="18" fill="#3e5168" style="fill:#3e5168" font-weight="400" text-anchor="start">核对区县与地点别名</text>
<text x="750" y="746" font-size="18" fill="#3e5168" style="fill:#3e5168" font-weight="400" text-anchor="start">最多3处，缺项定向补查</text>
<text x="750" y="777" font-size="18" fill="#3e5168" style="fill:#3e5168" font-weight="400" text-anchor="start">正常两遍，格式可另修正1次</text>
<text x="750" y="808" font-size="18" fill="#3e5168" style="fill:#3e5168" font-weight="400" text-anchor="start">详情失败隔离，保留可用主体</text>
</g>
<path d="M670,694 L724,694" fill="none" stroke="#899db5" stroke-width="2" marker-end="url(#arrow)"/>
<text x="680" y="678" font-size="18" fill="#5c6f86" style="fill:#5c6f86" font-weight="400" text-anchor="start">定位</text>
<path d="M880,847 L880,971 L676,971" fill="none" stroke="#899db5" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="44" y="1460" font-size="19" fill="#5c6f86" style="fill:#5c6f86" font-weight="400" text-anchor="start">高德的人均消费不能当作门票；引用保存在后台，聊天不展示引用编号。</text>
</svg>
