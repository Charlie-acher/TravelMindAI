<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1600" role="img" aria-label="聊天流程：流式事件、知识证据与餐饮地图">
<defs><style>text{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;fill:#24344b}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#899db5"/></marker></defs>
<rect width="1080" height="1600" fill="#f7f9fc" rx="18"/>
<text x="44" y="58" font-size="32" style="fill:#172b45" font-weight="700">聊天流程 · SSE公开过程 + 最终整轮保存</text>
<text x="44" y="95" font-size="21" style="fill:#3e5168" font-weight="400">普通旅行知识走证据链；附近餐饮直接查高德，草稿不等于已保存回答</text>
<path d="M540 245 L540 290" fill="none" stroke="#899db5" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M540 420 L540 453 L295 453 L295 490" fill="none" stroke="#899db5" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M540 453 L785 453 L785 490" fill="none" stroke="#899db5" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M295 680 L295 725" fill="none" stroke="#899db5" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M785 680 L785 725" fill="none" stroke="#899db5" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M295 915 L295 950 L540 950 L540 995" fill="none" stroke="#899db5" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M785 915 L785 950 L540 950" fill="none" stroke="#899db5" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M540 1125 L540 1170" fill="none" stroke="#899db5" stroke-width="2" marker-end="url(#arrow)"/>
<g data-box="50,135,980,110"><rect x="50" y="135" width="980" height="110" rx="10" fill="#fff" stroke="#197a94" stroke-opacity=".5" stroke-width="1.7"/>
<text x="72" y="171" font-size="24" style="fill:#197a94" font-weight="700">01 认证、归属与历史检查</text>
<text x="72" y="206" font-size="20" style="fill:#3e5168" font-weight="400">POST流式入口 → received进度；消息编号 + expected_revision</text>
<text x="72" y="236" font-size="20" style="fill:#3e5168" font-weight="400">已保存同一消息直接返回done；不再次检索或生成</text>
</g>
<g data-box="50,295,980,125"><rect x="50" y="295" width="980" height="125" rx="10" fill="#fff" stroke="#346cb2" stroke-opacity=".5" stroke-width="1.7"/>
<text x="72" y="331" font-size="24" style="fill:#346cb2" font-weight="700">02 提取并合并旅行需求</text>
<text x="72" y="366" font-size="20" style="fill:#3e5168" font-weight="400">DeepSeek提取 → 本地规则校验 → 分流；实际进入步骤才发送progress</text>
<text x="72" y="396" font-size="20" style="fill:#3e5168" font-weight="400">新目的地先尝试有依据的简介，再自然补问；个人条件不加无关不足提示</text>
</g>
<g data-box="50,490,490,190"><rect x="50" y="490" width="490" height="190" rx="10" fill="#fff" stroke="#7956a8" stroke-opacity=".5" stroke-width="1.7"/>
<text x="72" y="526" font-size="24" style="fill:#7956a8" font-weight="700">03A 普通知识：共享资料检索</text>
<text x="72" y="561" font-size="20" style="fill:#3e5168" font-weight="400">Embedding → Milvus → 回查原文</text>
<text x="72" y="591" font-size="20" style="fill:#3e5168" font-weight="400">结合本轮问题和有限历史，保留5段证据</text>
<text x="72" y="621" font-size="20" style="fill:#3e5168" font-weight="400">按需补网页、核对景点位置与门票</text>
<text x="72" y="651" font-size="20" style="fill:#3e5168" font-weight="400">旅行事实须有证据；缺项可以自然追问</text>
</g>
<g data-box="580,490,450,190"><rect x="580" y="490" width="450" height="190" rx="10" fill="#fff" stroke="#a47225" stroke-opacity=".5" stroke-width="1.7"/>
<text x="602" y="526" font-size="24" style="fill:#a47225" font-weight="700">03B 附近餐饮：直接查高德</text>
<text x="602" y="561" font-size="20" style="fill:#3e5168" font-weight="400">明确具体锚点；多地点有歧义先问</text>
<text x="602" y="591" font-size="20" style="fill:#3e5168" font-weight="400">短菜系回复接续上轮已核实地点</text>
<text x="602" y="621" font-size="20" style="fill:#3e5168" font-weight="400">圆形半径2000米，首批最多25条</text>
<text x="602" y="651" font-size="20" style="fill:#3e5168" font-weight="400">跳过RAG；不受无关知识资料阻断</text>
</g>
<g data-box="50,730,490,185"><rect x="50" y="730" width="490" height="185" rx="10" fill="#fff" stroke="#7956a8" stroke-opacity=".5" stroke-width="1.7"/>
<text x="72" y="766" font-size="24" style="fill:#7956a8" font-weight="700">04A 模型真实流 → 公开草稿</text>
<text x="72" y="801" font-size="20" style="fill:#3e5168" font-weight="400">仅公开points，引用限定本轮合法编号</text>
<text x="72" y="831" font-size="20" style="fill:#3e5168" font-weight="400">draft展示 / reset清空；仍待最终核对</text>
<text x="72" y="861" font-size="20" style="fill:#3e5168" font-weight="400">不显示原始JSON、工具参数或内部推理</text>
<text x="72" y="891" font-size="20" style="fill:#3e5168" font-weight="400">新一遍生成、格式修正后重新校验</text>
</g>
<g data-box="580,730,450,185"><rect x="580" y="730" width="450" height="185" rx="10" fill="#fff" stroke="#a47225" stroke-opacity=".5" stroke-width="1.7"/>
<text x="602" y="766" font-size="24" style="fill:#a47225" font-weight="700">04B 核对餐厅 → 真实结果</text>
<text x="602" y="801" font-size="20" style="fill:#3e5168" font-weight="400">核对城市、类别、坐标与POI去重</text>
<text x="602" y="831" font-size="20" style="fill:#3e5168" font-weight="400">实际4.0～5.0分，最多5家</text>
<text x="602" y="861" font-size="20" style="fill:#3e5168" font-weight="400">缺评分不补造；无结果/失败明确说明</text>
<text x="602" y="891" font-size="20" style="fill:#3e5168" font-weight="400">评分降序、距离升序；不是步行范围</text>
</g>
<g data-box="50,995,980,130"><rect x="50" y="995" width="980" height="130" rx="10" fill="#fff" stroke="#238366" stroke-opacity=".5" stroke-width="1.7"/>
<text x="72" y="1031" font-size="24" style="fill:#238366" font-weight="700">05 最终校验成功后保存</text>
<text x="72" y="1066" font-size="20" style="fill:#3e5168" font-weight="400">短事务：行锁 → 复查版本与幂等 → 写入requirement_turns.response_json</text>
<text x="72" y="1096" font-size="20" style="fill:#3e5168" font-weight="400">knowledge / dining整轮快照；旧历史缺字段默认null，无新增表或迁移</text>
</g>
<g data-box="50,1175,980,130"><rect x="50" y="1175" width="980" height="130" rx="10" fill="#fff" stroke="#197a94" stroke-opacity=".5" stroke-width="1.7"/>
<text x="72" y="1211" font-size="24" style="fill:#197a94" font-weight="700">06 done确认完成 → 页面正式回答</text>
<text x="72" y="1246" font-size="20" style="fill:#3e5168" font-weight="400">完成事件返回已保存轮次；替换临时草稿，显示文字、景点或餐厅卡片</text>
<text x="72" y="1276" font-size="20" style="fill:#3e5168" font-weight="400">刷新只读取历史；断流保留原消息编号，先恢复历史，不自动重复发送</text>
</g>
<g data-box="50,1350,490,165"><rect x="50" y="1350" width="490" height="165" rx="10" fill="#fff" stroke="#b55a70" stroke-opacity=".5" stroke-width="1.7"/>
<text x="72" y="1386" font-size="24" style="fill:#b55a70" font-weight="700">传输与错误</text>
<text x="72" y="1421" font-size="20" style="fill:#3e5168" font-weight="400">每15秒无事件时发心跳注释</text>
<text x="72" y="1451" font-size="20" style="fill:#3e5168" font-weight="400">error沿用脱敏HTTP错误码语义</text>
<text x="72" y="1481" font-size="20" style="fill:#3e5168" font-weight="400">ContextVar隔离请求与草稿引用范围</text>
</g>
<g data-box="580,1350,450,165"><rect x="580" y="1350" width="450" height="165" rx="10" fill="#fff" stroke="#b55a70" stroke-opacity=".5" stroke-width="1.7"/>
<text x="602" y="1386" font-size="24" style="fill:#b55a70" font-weight="700">断流与资源</text>
<text x="602" y="1421" font-size="20" style="fill:#3e5168" font-weight="400">独立连接继续已开始的校验与保存</text>
<text x="602" y="1451" font-size="20" style="fill:#3e5168" font-weight="400">正常关闭等待任务，再释放数据库</text>
<text x="602" y="1481" font-size="20" style="fill:#3e5168" font-weight="400">进程崩溃无聊天任务持久恢复队列</text>
</g>
<text x="50" y="1560" font-size="19" style="fill:#3e5168" font-weight="400">源码核对：2026-09-16 · thinking disabled；地图圆形半径不代表步行距离或耗时。</text>
</svg>
