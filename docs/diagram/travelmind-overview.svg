<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1330" role="img" aria-label="TravelMindAI · M1—M3 总体架构">
<defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#24344b}.sub{fill:#5c6f86}.small{font-size:19px}.body{font-size:21px}.name{font-size:25px;font-weight:700}</style>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#899db5"/></marker></defs>
<rect width="1100" height="1330" fill="#f7f9fc" rx="18"/>
<!-- 图形按层绘制；主线向下，分支只在相邻节点之间连接。 -->
<text x="44" y="58" font-size="32" fill="#172b45" style="fill:#172b45" font-weight="700" text-anchor="start">TravelMindAI · M1—M3 总体架构</text>
<text x="44" y="94" font-size="20" fill="#5c6f86" style="fill:#5c6f86" font-weight="400" text-anchor="start">按层阅读：使用入口 → HTTP接口 → 业务能力 → 模型与数据资源</text>
<rect x="30" y="125" width="1040" height="190" rx="14" fill="#eef2f7" stroke="#d5dfeb"/>
<text x="50" y="157" font-size="21" fill="#5c6f86" style="fill:#5c6f86" font-weight="700" text-anchor="start">01  使用入口</text>
<g data-box="50,175,640,115"><rect x="50" y="175" width="640" height="115" rx="10" fill="#ffffff" stroke="#a9cdd7" stroke-width="1.7"/>
<text x="70" y="211" font-size="24" fill="#197a94" style="fill:#197a94" font-weight="700" text-anchor="start">Vue 3 旅行页面</text>
<text x="70" y="245" font-size="21" fill="#3e5168" style="fill:#3e5168" font-weight="400" text-anchor="start">首问登录 / 流式对话 · 管理员资料库</text>
</g>
<g data-box="720,175,330,115"><rect x="720" y="175" width="330" height="115" rx="10" fill="#ffffff" stroke="#a9cdd7" stroke-width="1.7"/>
<text x="740" y="211" font-size="24" fill="#197a94" style="fill:#197a94" font-weight="700" text-anchor="start">接口文档 / 命令脚本</text>
<text x="740" y="245" font-size="20" fill="#3e5168" style="fill:#3e5168" font-weight="400" text-anchor="start">M1预算、会话与草稿调用</text>
</g>
<path d="M550,315 L550,355" fill="none" stroke="#899db5" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="360" width="1040" height="150" rx="14" fill="#eef2f7" stroke="#d5dfeb"/>
<text x="50" y="392" font-size="21" fill="#5c6f86" style="fill:#5c6f86" font-weight="700" text-anchor="start">02  HTTP接口层 · FastAPI</text>
<g data-box="50,408,1000,80"><rect x="50" y="408" width="1000" height="80" rx="10" fill="#ffffff" stroke="#a9cdd7" stroke-width="1.7"/>
<text x="70" y="444" font-size="24" fill="#197a94" style="fill:#197a94" font-weight="700" text-anchor="start">身份认证 / 会话归属 / 管理员授权 / 预算 / SSE聊天 / 资料处理</text>
</g>
<path d="M550,510 L550,550" fill="none" stroke="#899db5" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="555" width="1040" height="290" rx="14" fill="#eef2f7" stroke="#d5dfeb"/>
<text x="50" y="587" font-size="21" fill="#5c6f86" style="fill:#5c6f86" font-weight="700" text-anchor="start">03  业务服务层</text>
<g data-box="50,607,310,212"><rect x="50" y="607" width="310" height="212" rx="10" fill="#ffffff" stroke="#b1d6c8" stroke-width="1.7"/>
<text x="70" y="643" font-size="24" fill="#238366" style="fill:#238366" font-weight="700" text-anchor="start">M1 预算与草稿</text>
<text x="70" y="677" font-size="21" fill="#3e5168" style="fill:#3e5168" font-weight="400" text-anchor="start">固定规则预算估算</text>
<text x="70" y="708" font-size="21" fill="#3e5168" style="fill:#3e5168" font-weight="400" text-anchor="start">账号归属 / 会话历史分页</text>
<text x="70" y="739" font-size="21" fill="#3e5168" style="fill:#3e5168" font-weight="400" text-anchor="start">草稿保存、版本管理</text>
</g>
<g data-box="395,607,310,212"><rect x="395" y="607" width="310" height="212" rx="10" fill="#ffffff" stroke="#b8cee7" stroke-width="1.7"/>
<text x="415" y="643" font-size="24" fill="#346cb2" style="fill:#346cb2" font-weight="700" text-anchor="start">M2 需求对话</text>
<text x="415" y="677" font-size="21" fill="#3e5168" style="fill:#3e5168" font-weight="400" text-anchor="start">DeepSeek提取条件</text>
<text x="415" y="708" font-size="21" fill="#3e5168" style="fill:#3e5168" font-weight="400" text-anchor="start">本地校验、多轮合并</text>
<text x="415" y="739" font-size="21" fill="#3e5168" style="fill:#3e5168" font-weight="400" text-anchor="start">自然补问 / SSE与整轮保存</text>
</g>
<g data-box="740,607,310,212"><rect x="740" y="607" width="310" height="212" rx="10" fill="#ffffff" stroke="#cec0e1" stroke-width="1.7"/>
<text x="760" y="643" font-size="24" fill="#7956a8" style="fill:#7956a8" font-weight="700" text-anchor="start">M3 知识库与RAG</text>
<text x="760" y="677" font-size="20" fill="#3e5168" style="fill:#3e5168" font-weight="400" text-anchor="start">上传、预填、自动分段</text>
<text x="760" y="708" font-size="20" fill="#3e5168" style="fill:#3e5168" font-weight="400" text-anchor="start">向量索引与原文检索</text>
<text x="760" y="739" font-size="20" fill="#3e5168" style="fill:#3e5168" font-weight="400" text-anchor="start">证据回答 / 景点与餐饮分支</text>
<text x="760" y="771" font-size="17" style="fill:#3e5168">城市 / 类别先筛候选</text>
<text x="760" y="801" font-size="18" style="fill:#3e5168">自动索引，同时两份；失败可续建</text>
</g>
<path d="M550,845 L550,890" fill="none" stroke="#899db5" stroke-width="2" marker-end="url(#arrow)"/>
<text x="575" y="878" font-size="18" fill="#5c6f86" style="fill:#5c6f86" font-weight="400" text-anchor="start">按业务需要调用模型、工具或读写数据</text>
<rect x="30" y="895" width="1040" height="285" rx="14" fill="#eef2f7" stroke="#d5dfeb"/>
<text x="50" y="927" font-size="21" fill="#5c6f86" style="fill:#5c6f86" font-weight="700" text-anchor="start">04  模型、工具与存储资源</text>
<g data-box="50,945,310,94"><rect x="50" y="945" width="310" height="94" rx="10" fill="#ffffff" stroke="#dfcbaa" stroke-width="1.7"/>
<text x="70" y="981" font-size="24" fill="#a47225" style="fill:#a47225" font-weight="700" text-anchor="start">DeepSeek</text>
<text x="70" y="1015" font-size="19" fill="#3e5168" style="fill:#3e5168" font-weight="400" text-anchor="start">提取需求 / 依据证据回答</text>
</g>
<g data-box="395,945,310,94"><rect x="395" y="945" width="310" height="94" rx="10" fill="#ffffff" stroke="#dfcbaa" stroke-width="1.7"/>
<text x="415" y="981" font-size="24" fill="#a47225" style="fill:#a47225" font-weight="700" text-anchor="start">阿里云 Embedding</text>
<text x="415" y="1015" font-size="19" fill="#3e5168" style="fill:#3e5168" font-weight="400" text-anchor="start">文字与问题转为向量</text>
</g>
<g data-box="740,945,310,94"><rect x="740" y="945" width="310" height="94" rx="10" fill="#ffffff" stroke="#dfcbaa" stroke-width="1.7"/>
<text x="760" y="981" font-size="24" fill="#a47225" style="fill:#a47225" font-weight="700" text-anchor="start">高德 / Tavily工具</text>
<text x="760" y="1015" font-size="19" fill="#3e5168" style="fill:#3e5168" font-weight="400" text-anchor="start">地点与餐饮 / 网页补证，需Key</text>
</g>
<g data-box="50,1059,310,115"><rect x="50" y="1059" width="310" height="115" rx="10" fill="#ffffff" stroke="#cec0e1" stroke-width="1.7"/>
<text x="70" y="1095" font-size="24" fill="#7956a8" style="fill:#7956a8" font-weight="700" text-anchor="start">PostgreSQL</text>
<text x="70" y="1129" font-size="17" fill="#3e5168" style="fill:#3e5168" font-weight="400" text-anchor="start">账号 / 登录态 / 私人会话 / 资料</text>
<text x="70" y="1160" font-size="18" fill="#3e5168" style="fill:#3e5168" font-weight="400" text-anchor="start">资料标签 / document_jobs</text>
</g>
<g data-box="395,1059,310,115"><rect x="395" y="1059" width="310" height="115" rx="10" fill="#ffffff" stroke="#cec0e1" stroke-width="1.7"/>
<text x="415" y="1095" font-size="24" fill="#7956a8" style="fill:#7956a8" font-weight="700" text-anchor="start">Milvus</text>
<text x="415" y="1129" font-size="18" fill="#3e5168" style="fill:#3e5168" font-weight="400" text-anchor="start">向量与片段编号</text>
<text x="415" y="1160" font-size="18" fill="#3e5168" style="fill:#3e5168" font-weight="400" text-anchor="start">knowledge-base / 候选编号</text>
</g>
<g data-box="740,1059,310,115"><rect x="740" y="1059" width="310" height="115" rx="10" fill="#ffffff" stroke="#cec0e1" stroke-width="1.7"/>
<text x="760" y="1095" font-size="24" fill="#7956a8" style="fill:#7956a8" font-weight="700" text-anchor="start">本地文件</text>
<text x="760" y="1129" font-size="18" fill="#3e5168" style="fill:#3e5168" font-weight="400" text-anchor="start">保存上传的原始文件</text>
<text x="760" y="1160" font-size="18" fill="#3e5168" style="fill:#3e5168" font-weight="400" text-anchor="start">与数据库资料记录关联</text>
</g>
<text x="44" y="1224" font-size="19" fill="#5c6f86" style="fill:#5c6f86" font-weight="400" text-anchor="start">当前边界：M1使用固定演示价格；聊天不会自动计算预算或生成每日行程。</text>
<text x="44" y="1253" font-size="19" fill="#5c6f86" style="fill:#5c6f86" font-weight="400" text-anchor="start">普通旅行知识走RAG；附近餐饮直接查高德。公开草稿校验并保存后才成为正式回答。</text>
<text x="44" y="1282" font-size="18" class="sub">迁移0008–0010：账号、资料类别、会话归属。后台任务关闭页面继续，失败须显式重试。</text>
</svg>
